name: Runner smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on:
      - self-hosted
      - staging
      - office-net
    timeout-minutes: 10
    steps:
      - name: Show runner details
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          echo "Workspace: $GITHUB_WORKSPACE"

      - name: Execute simple commands
        run: |
          date -u
          whoami
          uname -a
          echo "Self-hosted runner is working."

      - name: Test DB TCP reachability
        env:
          STAGING_DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          STAGING_DB_PORT: ${{ secrets.STAGING_DB_PORT }}
        run: |
          set -euo pipefail
          timeout 5 bash -c ">/dev/tcp/${STAGING_DB_HOST}/${STAGING_DB_PORT}"
          echo "DB TCP reachable from runner at ${STAGING_DB_HOST}:${STAGING_DB_PORT}"
