# Servoy staging export properties template
# Rendered by entrypoint.sh using environment variables.

ServerManager.numberOfServers=1
repository_server=server.0
server.0.serverName=${DB_SERVER_NAME}
server.0.servername=${DB_SERVER_NAME}
server.0.URL=jdbc\:mysql\://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&useSSL=${DB_USE_SSL}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL}
server.0.userName=${DB_USER}
server.0.user=${DB_USER}
server.0.password=${DB_PASSWORD}
server.0.driver=com.mysql.cj.jdbc.Driver
server.0.catalog=${DB_NAME}
server.0.maxConnectionsActive=${DB_MAX_CONNECTIONS_ACTIVE}
server.0.maxConnectionsIdle=${DB_MAX_CONNECTIONS_IDLE}
server.0.maxPreparedStatementsIdle=${DB_MAX_PREPARED_STATEMENTS_IDLE}
server.0.connectionValidationType=${DB_CONNECTION_VALIDATION_TYPE}
server.0.validationQuery=select 1
server.0.clientOnlyConnections=${DB_CLIENT_ONLY_CONNECTIONS}
server.0.prefixTables=${DB_PREFIX_TABLES}
server.0.queryProcedures=${DB_QUERY_PROCEDURES}
server.0.schema=${DB_SCHEMA}
server.0.skipSysTables=${DB_SKIP_SYS_TABLES}
servoy.ngclient.testingMode=false
servoy.developer.showStartPage=false
servoy.application_server.allowClientRepositoryAccess=false
servoy.allowSolutionBrowsing=false
servoy.ngclient.enableWebResourceOptimizer=true
servoy.ngclient.setContentSecurityPolicyHeader=false
servoy.webclient.useAjax=true
servoy.webclient.nice.urls=true
servoy.webclient.enforceSecureCookies=true
