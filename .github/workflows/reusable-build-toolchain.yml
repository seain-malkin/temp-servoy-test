name: Build Toolchain Image

# Reusable workflow: builds (and optionally pushes) the Servoy toolchain base
# image to GHCR.
#
# Usage example:
#   jobs:
#     toolchain:
#       uses: ./.github/workflows/reusable-build-toolchain.yml
#       with:
#         tag: latest
#         push: true
#       secrets:
#         token: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_call:
    inputs:
      tag:
        description: "Image tag to apply (e.g. 'latest' or a version string)"
        type: string
        default: "latest"
      push:
        description: "Push the built image to GHCR"
        type: boolean
        default: false
      node_version:
        description: "Node.js version baked into the image"
        type: string
        default: "22.16.0"
      tomcat_version:
        description: "Tomcat 9 version baked into the image"
        type: string
        default: "9.0.117"
    secrets:
      token:
        description: "GitHub token used to push to GHCR (GITHUB_TOKEN is sufficient)"
        required: true
    outputs:
      image:
        description: "Full image reference (registry/name:tag)"
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/servoy-toolchain
          tags: type=raw,value=${{ inputs.tag }}

      - name: Build (and push) toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/toolchain/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ inputs.node_version }}
            TOMCAT_VERSION=${{ inputs.tomcat_version }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
