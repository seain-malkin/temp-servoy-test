name: Reusable Servoy CI

on:
  workflow_call:
    inputs:
      project_name:
        description: Servoy solution name used for WAR export.
        required: true
        type: string
      unit_test_solution:
        description: Servoy solution entrypoint for JSUnit tests.
        required: false
        default: servoy_unit_tests
        type: string
      servoy_assets_repo:
        description: Repository containing Servoy release assets.
        required: true
        type: string
      artifact_name:
        description: Uploaded artifact name for CI logs.
        required: false
        default: ci-logs
        type: string
      servoy_release_tag:
        description: Optional Servoy release tag; when empty the latest release is used.
        required: false
        default: ""
        type: string
      enable_unit_tests:
        description: Whether to execute JSUnit tests.
        required: false
        default: true
        type: boolean
    secrets:
      servoy_asset_token:
        required: true

jobs:
  servoy-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      ENABLE_UNIT_TESTS: ${{ inputs.enable_unit_tests }}
      UNIT_TEST_SOLUTION: ${{ inputs.unit_test_solution }}
      MYSQL_HOST_PORT: "3307"
      TOMCAT_HOST_PORT: "8080"
      MYSQL_ROOT_PASSWORD: root
      APP_DB_1_SERVER_NAME: appdb
      APP_DB_1_HOST: 127.0.0.1
      APP_DB_1_PORT: "3307"
      APP_DB_1_NAME: appdb
      APP_DB_1_USER: appuser
      APP_DB_1_PASSWORD: appsecret
      REPOSITORY_DB_NAME: repository_server
      REPOSITORY_DB_HOST: 127.0.0.1
      REPOSITORY_DB_PORT: "3307"
      REPOSITORY_DB_USER: repository_user
      REPOSITORY_DB_PASSWORD: repository_secret
      HEALTH_CHECK_URL: http://127.0.0.1:8080/
      SERVOY_ASSETS_REPO: ${{ inputs.servoy_assets_repo }}
      SERVOY_RELEASE_TAG: ${{ inputs.servoy_release_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install npm dependencies
        run: npm ci

      - name: Validate Servoy assets repository variable
        run: |
          if [ -z "${SERVOY_ASSETS_REPO}" ]; then
            echo "servoy_assets_repo input is required." >&2
            exit 1
          fi

      - name: Download Servoy binary
        env:
          GH_TOKEN: ${{ secrets.servoy_asset_token }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "servoy_asset_token secret is required." >&2
            exit 1
          fi
          release_tag="${SERVOY_RELEASE_TAG}"
          if [ -z "${release_tag}" ]; then
            release_tag="$(gh release list --repo "${SERVOY_ASSETS_REPO}" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          if [ -z "${release_tag}" ] || [ "${release_tag}" = "null" ]; then
            echo "No release tag available for ${SERVOY_ASSETS_REPO}." >&2
            exit 1
          fi
          mkdir -p artifacts
          gh release download "${release_tag}" \
            --repo "${SERVOY_ASSETS_REPO}" \
            --pattern "servoy_linux.*.tar.gz" \
            --dir artifacts \
            --clobber

      - name: Prepare CI directories
        run: mkdir -p _ci/tomcat/webapps _ci/tomcat/logs _ci/logs _ci/tools

      - name: Start compose services
        run: docker compose -f ci/docker-compose.ci.yml up -d mysql tomcat

      - name: Run Servoy migration and tests
        run: bash ci/scripts/run-servoy-ci.sh

      - name: Collect compose logs
        if: always()
        run: |
          docker compose -f ci/docker-compose.ci.yml logs --no-color > _ci/logs/compose.log || true
          docker logs servoy-ci-mysql > _ci/logs/mysql.log 2>&1 || true
          docker logs servoy-ci-tomcat > _ci/logs/tomcat.log 2>&1 || true

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: _ci/logs
          if-no-files-found: ignore

      - name: Stop compose services
        if: always()
        run: docker compose -f ci/docker-compose.ci.yml down -v
